server:
  port: 8080

spring:
  application:
    name: rtdwh-management
  mvc:
    throw-exception-if-no-handler-found: true

  # Undertow 配置（替换 Tomcat，避免 javax.servlet.jsp ClassCastException）
  undertow:
    threads:
      worker: 200
      io: 8
    buffer-size: 1024
    direct-buffers: true

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/rtdwh_mgmt?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root123123}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        globally_quoted_identifiers: true
        globally_quoted_identifiers_skip_column_definitions: true

  # Flyway owns explicit platform migrations. Hibernate update remains temporarily
  # enabled for legacy tables until the complete historical baseline is consolidated.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

  mail:
    host: ${MAIL_HOST:smtp.example.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 10000
          timeout: 30000
          writetimeout: 30000
          ssl:
            enable: true

  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: always
    properties:
      org.quartz.scheduler.instanceName: RTDWHScheduler
      org.quartz.threadPool.threadCount: 5

  cache:
    type: simple

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:9$sK7pRz2QvBnG5dF8hJ0tLcX1mY4wA6uE#3iN%7oS&9bD*2gZ_5jP-8rT=1kV?6qC}
  expiration: 86400000  # 24 hours in ms
  refresh-expiration: 604800000  # 7 days in ms
  header: Authorization
  prefix: "Bearer "

# Flink Cluster Configuration
flink:
  rest-api:
    url: ${FLINK_REST_URL:http://localhost:8081}
    timeout-seconds: 30
  submission:
    mode: application  # application | session
    jar-path: ${FLINK_JAR_PATH:/opt/flink/lib}
    savepoint-dir: ${FLINK_SAVEPOINT_DIR:file:///tmp/flink-savepoints}
  sql-gateway:
    enabled: ${SQL_GATEWAY_ENABLED:true}
    url: ${SQL_GATEWAY_URL:http://localhost:9083}
  scaling:
    # standalone observes/rescales jobs but cannot create TaskManagers;
    # kubernetes-native lets Flink's ResourceManager allocate them on demand.
    provider: ${FLINK_SCALING_PROVIDER:standalone}
    min-parallelism: ${FLINK_SCALING_MIN_PARALLELISM:1}
    max-parallelism: ${FLINK_SCALING_MAX_PARALLELISM:128}
  status-monitor:
    enabled: true
    interval-seconds: 30  # Poll every 30 seconds

# Persisted dependency health snapshot
health:
  monitor:
    enabled: ${HEALTH_MONITOR_ENABLED:true}
    interval-ms: ${HEALTH_MONITOR_INTERVAL_MS:60000}
    initial-delay-ms: ${HEALTH_MONITOR_INITIAL_DELAY_MS:5000}

# Paimon Configuration — MySQL JDBC Metastore
paimon:
  warehouse-path: ${PAIMON_WAREHOUSE:${user.home}/rtdwh-data/paimon}
  metastore: jdbc
  jdbc-uri: ${PAIMON_JDBC_URI:jdbc:mysql://localhost:3306/rtdwh_paimon_meta}
  jdbc-user: ${PAIMON_JDBC_USER:root}
  jdbc-password: ${PAIMON_JDBC_PASSWORD:root123123}
  catalog-key: ${PAIMON_CATALOG_KEY:rtdwh}

# Encryption Configuration
encryption:
  key: ${ENCRYPTION_KEY:}

# Query Configuration
query:
  engine: doris
  max-rows: 1000
  max-export-rows: 50000
  timeout-seconds: 60
  max-concurrent-per-user: ${QUERY_MAX_CONCURRENT_PER_USER:2}
  queue-wait-seconds: ${QUERY_QUEUE_WAIT_SECONDS:3}
  budget:
    scanned-bytes: ${QUERY_BUDGET_SCANNED_BYTES:5368709120}
    cpu-ms: ${QUERY_BUDGET_CPU_MS:30000}
    peak-memory-bytes: ${QUERY_BUDGET_PEAK_MEMORY_BYTES:2147483648}

# Doris serves interactive queries over its MySQL-compatible FE endpoint.
doris:
  enabled: ${DORIS_ENABLED:true}
  jdbc-url: ${DORIS_JDBC_URL:jdbc:mysql://localhost:9030}
  http-url: ${DORIS_HTTP_URL:http://localhost:8030}
  username: ${DORIS_USERNAME:root}
  password: ${DORIS_PASSWORD:}
  catalog: ${DORIS_CATALOG:rtdwh_paimon}
  database: ${DORIS_DATABASE:ods}
  initialize-catalog: ${DORIS_INITIALIZE_CATALOG:true}
  workload-group: ${DORIS_WORKLOAD_GROUP:rtdwh_adhoc}
  exec-mem-limit-bytes: ${DORIS_EXEC_MEM_LIMIT_BYTES:2147483648}
  paimon-warehouse-path: ${DORIS_PAIMON_WAREHOUSE:/data/paimon}
  paimon-jdbc-uri: "${DORIS_PAIMON_JDBC_URI:jdbc:mysql://mysql:3306/rtdwh_paimon_meta?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}"
  paimon-jdbc-driver-url: ${DORIS_PAIMON_JDBC_DRIVER_URL:https://repo1.maven.org/maven2/com/mysql/mysql-connector-j/8.4.0/mysql-connector-j-8.4.0.jar}
  # 0 disables only the Paimon table-object cache so each query sees the latest snapshot.
  paimon-table-cache-ttl-seconds: ${DORIS_PAIMON_TABLE_CACHE_TTL_SECONDS:0}
  catalog-init:
    retry-ms: ${DORIS_CATALOG_INIT_RETRY_MS:30000}
  pool:
    maximum-size: ${DORIS_POOL_MAXIMUM_SIZE:10}
    connection-timeout-ms: ${DORIS_CONNECTION_TIMEOUT_MS:5000}

# Alert Configuration
alert:
  dingtalk-webhook: ${DINGTALK_WEBHOOK:}
  wecom-webhook: ${WECOM_WEBHOOK:}
  email-recipients: ${ALERT_EMAIL_RECIPIENTS:admin@example.com}
  email-from: ${ALERT_EMAIL_FROM:rtdwh-alert@example.com}
  schedule:
    enabled: ${ALERT_SCHEDULE_ENABLED:true}
    interval-ms: ${ALERT_SCHEDULE_INTERVAL_MS:30000}
    initial-delay-ms: ${ALERT_SCHEDULE_INITIAL_DELAY_MS:15000}

quality:
  schedule:
    timezone: ${QUALITY_SCHEDULE_TIMEZONE:Asia/Shanghai}
    enabled: ${QUALITY_SCHEDULE_ENABLED:true}
    interval-ms: ${QUALITY_SCHEDULE_INTERVAL_MS:3600000}
    initial-delay-ms: ${QUALITY_SCHEDULE_INITIAL_DELAY_MS:60000}

report:
  schedule:
    enabled: ${REPORT_SCHEDULE_ENABLED:true}
    interval-ms: ${REPORT_SCHEDULE_INTERVAL_MS:30000}
    initial-delay-ms: ${REPORT_SCHEDULE_INITIAL_DELAY_MS:30000}

workflow:
  schedule-trigger:
    enabled: ${WORKFLOW_SCHEDULE_TRIGGER_ENABLED:true}
    interval-ms: ${WORKFLOW_SCHEDULE_TRIGGER_INTERVAL_MS:10000}
    initial-delay-ms: ${WORKFLOW_SCHEDULE_TRIGGER_INITIAL_DELAY_MS:15000}
  scheduler:
    enabled: ${WORKFLOW_SCHEDULER_ENABLED:true}
    dependency-check-ms: ${WORKFLOW_DEPENDENCY_CHECK_MS:10000}
    initial-delay-ms: ${WORKFLOW_INITIAL_DELAY_MS:10000}
  runner:
    enabled: ${WORKFLOW_RUNNER_ENABLED:false}
    executor-id: ${WORKFLOW_RUNNER_EXECUTOR_ID:internal-flink-sql}
    interval-ms: ${WORKFLOW_RUNNER_INTERVAL_MS:5000}
    initial-delay-ms: ${WORKFLOW_RUNNER_INITIAL_DELAY_MS:15000}
    max-concurrent: ${WORKFLOW_RUNNER_MAX_CONCURRENT:2}
    lease-seconds: ${WORKFLOW_RUNNER_LEASE_SECONDS:60}
    max-retries: ${WORKFLOW_RUNNER_MAX_RETRIES:3}
    retry-backoff-seconds: ${WORKFLOW_RUNNER_RETRY_BACKOFF_SECONDS:30}

# CDC Configuration
cdc:
  flink-cdc-version: ${FLINK_CDC_VERSION:3.6.0-2.2}
  debezium-version: ${DEBEZIUM_VERSION:2.5.0}
  paimon-version: ${PAIMON_VERSION:2.0.0}
  default-start-mode: ${CDC_START_MODE:initial}  # initial | incremental

# Logging
logging:
  level:
    root: INFO
    com.rtdwh: DEBUG
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

# App Initialization (disabled in production)
app:
  init-users:
    enabled: ${INIT_USERS_ENABLED:true}
    admin-password: ${INIT_ADMIN_PASSWORD:admin123}
    dev-password: ${INIT_DEV_PASSWORD:dev}
    guest-password: ${INIT_GUEST_PASSWORD:guest}
