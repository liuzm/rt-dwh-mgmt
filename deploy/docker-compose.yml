services:
  # MySQL - 管理库元数据存储
  mysql:
    image: mysql:8.0
    container_name: rtdwh-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
      MYSQL_DATABASE: rtdwh_mgmt
      MYSQL_USER: ${MYSQL_USER:-rtdwh_admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../scripts/init-mysql.sql:/docker-entrypoint-initdb.d/init.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - rtdwh-backend

  # PostgreSQL - 可选业务源库示例
  postgresql:
    image: postgres:13
    container_name: rtdwh-postgresql
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: ${PG_USER:-rtdwh_admin}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-rtdwh_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - rtdwh-backend

  # Flink JobManager
  flink-jobmanager:
    build:
      context: ./flink
      dockerfile: Dockerfile
    image: rtdwh-flink:2.2.1
    container_name: rtdwh-flink-jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        execution.checkpointing.dir: file:///tmp/flink-checkpoints
        execution.checkpointing.savepoint-dir: file:///tmp/flink-savepoints
    volumes:
      - flink_data:/opt/flink/data
      - paimon_data:/data/paimon
      - savepoint_data:/tmp/flink-savepoints
    restart: unless-stopped
    networks:
      - rtdwh-backend

  # Flink TaskManager
  flink-taskmanager:
    build:
      context: ./flink
      dockerfile: Dockerfile
    image: rtdwh-flink:2.2.1
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        execution.checkpointing.dir: file:///tmp/flink-checkpoints
        execution.checkpointing.savepoint-dir: file:///tmp/flink-savepoints
    volumes:
      - flink_data:/opt/flink/data
      - paimon_data:/data/paimon
      - savepoint_data:/tmp/flink-savepoints
    deploy:
      replicas: 2
    restart: unless-stopped
    networks:
      - rtdwh-backend

  # Flink SQL Gateway - executes generated CDC/Paimon SQL scripts
  flink-sql-gateway:
    build:
      context: ./flink
      dockerfile: Dockerfile
    image: rtdwh-flink:2.2.1
    container_name: rtdwh-flink-sql-gateway
    depends_on:
      - flink-jobmanager
    command:
      - /opt/flink/bin/sql-gateway.sh
      - start-foreground
      - -Dsql-gateway.endpoint.rest.bind-address=0.0.0.0
      - -Dsql-gateway.endpoint.rest.address=flink-sql-gateway
      - -Dsql-gateway.endpoint.rest.port=8083
      - -Drest.address=flink-jobmanager
      - -Drest.port=8081
    ports:
      - "127.0.0.1:9083:8083"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        rest.address: flink-jobmanager
        rest.port: 8081
        table.dml-sync: false
    volumes:
      - paimon_data:/data/paimon
      - savepoint_data:/tmp/flink-savepoints
    restart: unless-stopped
    networks:
      - rtdwh-backend

  # Spring Boot Management Backend
  rtdwh-backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: rtdwh-backend
    ports:
      - "8080:8080"
    environment:
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DB_USERNAME=${DB_USERNAME:-rtdwh_admin}
      - FLINK_REST_URL=http://flink-jobmanager:8081
      - FLINK_JAR_PATH=/opt/flink/usrlib
      - FLINK_SAVEPOINT_DIR=file:///tmp/flink-savepoints
      - SQL_GATEWAY_ENABLED=true
      - SQL_GATEWAY_URL=http://flink-sql-gateway:8083
      - PAIMON_WAREHOUSE=/data/paimon
      - PAIMON_JDBC_URI=jdbc:mysql://mysql:3306/rtdwh_paimon_meta?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
      - PAIMON_JDBC_USER=${PAIMON_JDBC_USER:-rtdwh_admin}
      - PAIMON_JDBC_PASSWORD=${PAIMON_JDBC_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - INIT_USERS_ENABLED=${INIT_USERS_ENABLED:-false}
      - INIT_ADMIN_PASSWORD=${INIT_ADMIN_PASSWORD:-}
      - INIT_DEV_PASSWORD=${INIT_DEV_PASSWORD:-}
      - INIT_GUEST_PASSWORD=${INIT_GUEST_PASSWORD:-}
      - HEALTH_MONITOR_ENABLED=${HEALTH_MONITOR_ENABLED:-true}
      - HEALTH_MONITOR_INTERVAL_MS=${HEALTH_MONITOR_INTERVAL_MS:-60000}
      - HEALTH_MONITOR_INITIAL_DELAY_MS=${HEALTH_MONITOR_INITIAL_DELAY_MS:-5000}
      - MAIL_HOST=${MAIL_HOST:-}
      - DINGTALK_WEBHOOK=${DINGTALK_WEBHOOK:-}
      - WECOM_WEBHOOK=${WECOM_WEBHOOK:-}
      - ALERT_EMAIL_RECIPIENTS=${ALERT_EMAIL_RECIPIENTS:-}
    depends_on:
      mysql:
        condition: service_healthy
      flink-sql-gateway:
        condition: service_started
    volumes:
      - paimon_data:/data/paimon
      - savepoint_data:/tmp/flink-savepoints
    restart: unless-stopped
    networks:
      - rtdwh-backend
      - rtdwh-frontend

  # Nginx Reverse Proxy (Frontend + Backend)
  rtdwh-nginx:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    container_name: rtdwh-nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - rtdwh-backend
    restart: unless-stopped
    networks:
      - rtdwh-frontend

  # Prometheus (optional - monitoring)
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: rtdwh-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ../deploy/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    restart: unless-stopped
    profiles:
      - monitoring
    networks:
      - rtdwh-backend

  # Grafana (optional - visualization)
  grafana:
    image: grafana/grafana:11.0.0
    container_name: rtdwh-grafana
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    profiles:
      - monitoring
    networks:
      - rtdwh-backend

volumes:
  mysql_data:
  pg_data:
  flink_data:
  paimon_data:
  savepoint_data:
  prometheus_data:
  grafana_data:

networks:
  rtdwh-backend:
    driver: bridge
  rtdwh-frontend:
    driver: bridge
