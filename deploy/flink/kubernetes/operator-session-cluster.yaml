# Flink Kubernetes Operator 1.15.0 / Flink 2.2.1 example.
#
# Before applying this manifest:
#   1. Install the Flink Kubernetes Operator and its CRDs.
#   2. Push rtdwh-flink:2.2.1 to a registry reachable by the cluster.
#   3. Replace every s3://replace-me-before-apply URI below.
#   4. Enable the matching Flink filesystem plugin and provide object-store
#      credentials through workload identity or a Kubernetes Secret.
#
# Never replace the external state URIs with file:// paths in production. A
# local filesystem is not shared by replacement JobManager/TaskManager pods.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: rtdwh-flink-native
  labels:
    app.kubernetes.io/name: rtdwh-flink
    app.kubernetes.io/component: session-cluster
---
# The native Kubernetes ResourceManager creates and removes TaskManager pods;
# Kubernetes HA also stores leader metadata in ConfigMaps.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rtdwh-flink-native
  labels:
    app.kubernetes.io/name: rtdwh-flink
    app.kubernetes.io/component: session-cluster
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/finalizers"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rtdwh-flink-native
  labels:
    app.kubernetes.io/name: rtdwh-flink
    app.kubernetes.io/component: session-cluster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rtdwh-flink-native
subjects:
  - kind: ServiceAccount
    name: rtdwh-flink-native
---
# This FlinkDeployment intentionally has no spec.job: it is a native Session
# Cluster. SQL Gateway submits jobs to the generated
# rtdwh-flink-session-rest:8081 Service.
apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: rtdwh-flink-session
  labels:
    app.kubernetes.io/name: rtdwh-flink
    app.kubernetes.io/component: session-cluster
spec:
  image: rtdwh-flink:2.2.1
  imagePullPolicy: IfNotPresent
  flinkVersion: v2_2
  mode: native
  serviceAccount: rtdwh-flink-native
  flinkConfiguration:
    jobmanager.scheduler: adaptive
    taskmanager.numberOfTaskSlots: "2"
    execution.checkpointing.storage: filesystem
    execution.checkpointing.dir: s3://replace-me-before-apply/rtdwh/checkpoints
    execution.checkpointing.savepoint-dir: s3://replace-me-before-apply/rtdwh/savepoints
    high-availability.type: kubernetes
    high-availability.storageDir: s3://replace-me-before-apply/rtdwh/ha
    jobmanager.adaptive-scheduler.resource-stabilization-timeout: 10s
    jobmanager.adaptive-scheduler.resource-wait-timeout: 5m
  jobManager:
    replicas: 2
    resource:
      cpu: 1
      memory: 2048m
  taskManager:
    resource:
      cpu: 2
      memory: 4096m
---
# SQL Gateway is deliberately a separate workload. The Operator reconciles the
# Session Cluster but does not own jobs submitted through this Gateway.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rtdwh-flink-sql-gateway
  labels:
    app.kubernetes.io/name: rtdwh-flink
    app.kubernetes.io/component: sql-gateway
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rtdwh-flink-sql-gateway
  labels:
    app.kubernetes.io/name: rtdwh-flink
    app.kubernetes.io/component: sql-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rtdwh-flink
      app.kubernetes.io/component: sql-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rtdwh-flink
        app.kubernetes.io/component: sql-gateway
    spec:
      serviceAccountName: rtdwh-flink-sql-gateway
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sql-gateway
          image: rtdwh-flink:2.2.1
          imagePullPolicy: IfNotPresent
          args:
            - /opt/flink/bin/sql-gateway.sh
            - start-foreground
            - -Dsql-gateway.endpoint.rest.bind-address=0.0.0.0
            - -Dsql-gateway.endpoint.rest.address=rtdwh-flink-sql-gateway
            - -Dsql-gateway.endpoint.rest.port=8083
            - -Drest.address=rtdwh-flink-session-rest
            - -Drest.port=8081
          env:
            - name: FLINK_PROPERTIES
              value: |
                rest.address: rtdwh-flink-session-rest
                rest.port: 8081
                table.dml-sync: false
          ports:
            - name: rest
              containerPort: 8083
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /v1/info
              port: rest
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /v1/info
              port: rest
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/info
              port: rest
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: rtdwh-flink-sql-gateway
  labels:
    app.kubernetes.io/name: rtdwh-flink
    app.kubernetes.io/component: sql-gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rtdwh-flink
    app.kubernetes.io/component: sql-gateway
  ports:
    - name: rest
      port: 8083
      targetPort: rest
