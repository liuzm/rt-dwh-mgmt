{{- if .Values.backend.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rtdwh-mgmt.secretName" . }}
  labels:
    {{- include "rtdwh-mgmt.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_PASSWORD: {{ required "backend.secret.data.DB_PASSWORD is required" .Values.backend.secret.data.DB_PASSWORD | quote }}
  PAIMON_JDBC_PASSWORD: {{ required "backend.secret.data.PAIMON_JDBC_PASSWORD is required" .Values.backend.secret.data.PAIMON_JDBC_PASSWORD | quote }}
  DORIS_PASSWORD: {{ .Values.backend.secret.data.DORIS_PASSWORD | quote }}
  JWT_SECRET: {{ required "backend.secret.data.JWT_SECRET is required" .Values.backend.secret.data.JWT_SECRET | quote }}
  ENCRYPTION_KEY: {{ required "backend.secret.data.ENCRYPTION_KEY is required" .Values.backend.secret.data.ENCRYPTION_KEY | quote }}
  INIT_ADMIN_PASSWORD: {{ .Values.backend.secret.data.INIT_ADMIN_PASSWORD | quote }}
  INIT_DEV_PASSWORD: {{ .Values.backend.secret.data.INIT_DEV_PASSWORD | quote }}
  INIT_GUEST_PASSWORD: {{ .Values.backend.secret.data.INIT_GUEST_PASSWORD | quote }}
{{- end }}
