# RT-DWH Management Platform Helm values.
# Passwords and cryptographic keys are intentionally not stored in this file.

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

podDisruptionBudget:
  enabled: false
  minAvailable: 1

backend:
  replicaCount: 1
  image:
    repository: rtdwh/backend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: "2"
      memory: "2Gi"
    requests:
      cpu: "500m"
      memory: "1Gi"
  # Production default: reference a Secret created by your secret manager.
  secret:
    create: false
    existingSecret: rtdwh-mgmt-secrets
    keys:
      - DB_PASSWORD
      - PAIMON_JDBC_PASSWORD
      - JWT_SECRET
      - ENCRYPTION_KEY
    optionalKeys:
      - DORIS_PASSWORD
      - INIT_ADMIN_PASSWORD
      - INIT_DEV_PASSWORD
      - INIT_GUEST_PASSWORD
    data:
      DB_PASSWORD: ""
      PAIMON_JDBC_PASSWORD: ""
      DORIS_PASSWORD: ""
      JWT_SECRET: ""
      ENCRYPTION_KEY: ""
      INIT_ADMIN_PASSWORD: ""
      INIT_DEV_PASSWORD: ""
      INIT_GUEST_PASSWORD: ""
  env:
    DB_USERNAME: rtdwh_admin
    SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/rtdwh_mgmt?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    PAIMON_JDBC_URI: jdbc:mysql://mysql:3306/rtdwh_paimon_meta?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    PAIMON_JDBC_USER: rtdwh_admin
    PAIMON_WAREHOUSE: /data/paimon
    DORIS_PAIMON_WAREHOUSE: /data/paimon
    FLINK_REST_URL: http://flink-jobmanager:8081
    SQL_GATEWAY_URL: http://flink-jobmanager:8083
    # Keep standalone unless the target REST endpoint is a Flink Native
    # Kubernetes cluster whose JobManager may create/remove TaskManager pods.
    FLINK_SCALING_PROVIDER: standalone
    FLINK_SCALING_MIN_PARALLELISM: "1"
    FLINK_SCALING_MAX_PARALLELISM: "128"
    DORIS_ENABLED: "true"
    DORIS_JDBC_URL: jdbc:mysql://doris-fe:9030
    DORIS_HTTP_URL: http://doris-fe:8030
    DORIS_USERNAME: rtdwh_query
    DORIS_CATALOG: rtdwh_paimon
    DORIS_DATABASE: ods
    DORIS_INITIALIZE_CATALOG: "true"
    QUERY_MAX_CONCURRENT_PER_USER: "2"
    QUERY_QUEUE_WAIT_SECONDS: "3"
    QUERY_BUDGET_SCANNED_BYTES: "5368709120"
    QUERY_BUDGET_CPU_MS: "30000"
    QUERY_BUDGET_PEAK_MEMORY_BYTES: "2147483648"
    HEALTH_MONITOR_ENABLED: "true"
    REPORT_SCHEDULE_ENABLED: "true"
    WORKFLOW_SCHEDULE_TRIGGER_ENABLED: "true"
    WORKFLOW_SCHEDULE_TRIGGER_INTERVAL_MS: "10000"
    WORKFLOW_RUNNER_ENABLED: "true"
    INIT_USERS_ENABLED: "false"

frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: rtdwh/frontend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "100m"
      memory: "128Mi"

ingress:
  enabled: true
  className: nginx
  host: rtdwh.local
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
  tls: []
