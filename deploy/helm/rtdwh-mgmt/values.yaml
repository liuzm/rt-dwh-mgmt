# RT-DWH Management Platform Helm Values

replicaCount: 1

# Backend Configuration
backend:
  image:
    repository: rtdwh/backend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: "2"
      memory: "2Gi"
    requests:
      cpu: "1"
      memory: "1Gi"
  env:
    DB_PASSWORD: "rtdwh2026"
    FLINK_REST_URL: "http://flink-jobmanager:8081"
    JWT_SECRET: "rtdwh-management-platform-secret-key-2026"
    PAIMON_WAREHOUSE: "/data/paimon"
    HEALTH_MONITOR_ENABLED: "true"
    HEALTH_MONITOR_INTERVAL_MS: "60000"
    HEALTH_MONITOR_INITIAL_DELAY_MS: "5000"
    INIT_USERS_ENABLED: "false"
    INIT_ADMIN_PASSWORD: ""
    INIT_DEV_PASSWORD: ""
    INIT_GUEST_PASSWORD: ""

# Frontend Configuration
frontend:
  image:
    repository: rtdwh/frontend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "200m"
      memory: "256Mi"

# Flink Cluster
flink:
  image:
    repository: flink
    tag: "2.2.0-java17"
  jobmanager:
    replicas: 1
    service:
      type: ClusterIP
      port: 8081
    resources:
      limits:
        cpu: "1"
        memory: "2Gi"
  taskmanager:
    replicas: 2
    taskSlots: 4
    resources:
      limits:
        cpu: "2"
        memory: "4Gi"

# MySQL
mysql:
  enabled: true
  image:
    repository: mysql
    tag: "5.7"
  service:
    type: ClusterIP
    port: 3306
  persistence:
    enabled: true
    size: 10Gi
  auth:
    rootPassword: "root2026"
    database: "rtdwh_mgmt"
    username: "rtdwh_admin"
    password: "rtdwh2026"

# Prometheus (optional)
prometheus:
  enabled: false
  image:
    repository: prom/prometheus
    tag: "v2.52.0"
  service:
    type: ClusterIP
    port: 9090

# Grafana (optional)
grafana:
  enabled: false
  image:
    repository: grafana/grafana
    tag: "11.0.0"
  service:
    type: ClusterIP
    port: 3000
  adminPassword: "admin2026"
